[project]
name = "opsbrain"
version = "0.1.0"
description = "Token-cheap MCP server for infrastructure operations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.2.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.scripts]
opsbrain = "opsbrain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opsbrain"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM"]
ignore = ["S603", "S607", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
